[project]
name = "agdata"
version = "0.1.0"
description = "Grid, variable catalog, Zarr stores, source adapters and tile encoding"
requires-python = ">=3.13,<3.14"
license = "AGPL-3.0-or-later"
dependencies = [
    "agmodels",
    "cdsapi>=0.7.7",
    "eccodes>=2.50.0",
    "numpy",
    "pcodec>=1.0.4",
    "pyproj",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "timezonefinder>=9.2.0",
    "xarray",
    "zarr",
]

[project.optional-dependencies]
# Open-Meteo's IFS files (D52). omfiles is GPL-2.0-only, so it stays out of the core install (D53)
ifs = ["omfiles>=1.2", "fsspec", "s3fs"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
agmodels = { workspace = true }
