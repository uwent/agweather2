[project]
name = "agdata"
version = "0.1.0"
description = "Grid, variable catalog, Zarr stores, source adapters and tile encoding"
requires-python = ">=3.13,<3.14"
dependencies = [
    "agmodels",
    "eccodes>=2.50.0",
    "numpy",
    "pcodec>=1.0.4",
    "pyproj",
    "requests>=2.34.2",
    "timezonefinder>=9.2.0",
    "xarray",
    "zarr",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
agmodels = { workspace = true }
