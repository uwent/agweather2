# The Django project (Phase 1 B). Not built as a package; uv installs its dependencies.
[project]
name = "agweather-app"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "agmodels",
    "agdata",
    "django>=6.1.2",
    "inertia-django>=2.0.0",
    "django-vite>=3.2.0",
    "django-ninja>=1.7.1",
    "procrastinate[django]>=3.10.0",
    "psycopg[binary]>=3.3.6",
    "uvicorn[standard]>=0.54.0",
    "dj-database-url>=3.1.2",
    "python-dotenv>=1.2.4",
]

[tool.uv]
package = false

[tool.uv.sources]
agmodels = { workspace = true }
agdata = { workspace = true }
