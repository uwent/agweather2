# The Django project (Phase 1 B). Not built as a package; uv installs its dependencies.
[project]
name = "agweather-app"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["agmodels", "agdata"]

[tool.uv]
package = false

[tool.uv.sources]
agmodels = { workspace = true }
agdata = { workspace = true }
