url = "Where to read about the source."

[CorrectionInfo]
id = "The correction's id, as `/variables`, the models' inputs and `meta.summary.corrections` name it."
title = "What the correction applies to."
summary = "What it corrects, how, and what it was fitted against."
variables = "The variables whose values it changes, by their names in `/variables`."
version = "The correction's version. It changes whenever the correction is fitted again or changed."
fitted = "The day it was last fitted (YYYY-MM-DD). Null when it is fitted again whenever its data are, as for the 30-year normal's earlier years."
scores = "How much the correction improved its data, measured on data it was not fitted to. Empty when there is no such test."
evidence = "Links to our technical reports on the correction: how it was fitted and tested, with fuller results."

[ScoreInfo]
measure = "What was measured."
unit = "The unit of `before` and `after`, as `units` overrides name it. `index` for a ratio, which has no unit."
