# Public text for the API's parameters, tags and response schemas (see __init__.py). Written for the public:
# follow CLAUDE.md's "Writing for the public". [shared] holds the parameters that mean the same thing on every
# endpoint; a table named after an operation holds that endpoint's own parameters, and replaces a shared one's
# text where its meaning differs there.

[tags]
"About the data" = "What the service holds: the dates covered by the archive and forecast, the variables, the models, and the grid cell, county and typical planting dates at a location."
"Weather" = "Hourly and daily weather at one or more locations, and totals over a period of days."
"Degree days, chill and freezes" = "Growing degree days by any method and thresholds, totals for reports covering many locations, winter chill for fruit trees, and freeze dates."
"Models" = "Crop disease, insect and crop development models, run on our weather at a location or on weather you send from your own station."
"Maps and grids" = "Any weather variable or model as a map: gridded data in JSON, CSV, NetCDF or GeoTIFF, map tiles for web and GIS software, and finished map images."

[schemas]
TableResponse = "A table of results. `meta` describes the request as computed, the location, the units of each column and a summary; `data` holds the columns."
ErrorResponse = "A request that could not be answered. `errors` lists each problem, the parameter at fault, and what to change."
StatusResponse = "What the archive and forecast hold now."
VariablesResponse = "The weather variables the service provides."
ModelsResponse = "Every model the service runs."
ModelResponse = "One model's full description."
LocateResponse = "What the service knows about a location."
LayersResponse = "Every layer that can be shown as a map."
DownloadsResponse = "The yearly data files available for download."

[shared]
lat = "Latitude of the location, in decimal degrees (for example 43.07). `latitude` is also accepted."
lng = "Longitude of the location, in decimal degrees, negative west of Greenwich (for example -89.40). `lon`, `long` and `longitude` are also accepted."
points = "Several locations in one request, in place of `lat` and `lng`: latitude and longitude pairs separated by semicolons, as `43.07,-89.40;44.52,-89.57`. Up to 50 locations. Each row of the response has a `point` column giving its location's position in `meta.locations`."
date = "A single day, as YYYY-MM-DD, in place of `start` and `end`."
start = "The first day, as YYYY-MM-DD. The default is January 1 of the year of `end`."
end = "The last day, as YYYY-MM-DD, included in the results. The default runs through the forecast, or through today with `forecast=false`."
forecast = "Whether to continue past the last observed day into the forecast (`true`, the default) or stop there (`false`). The `kind` column marks forecast days."
gaps = "How a running total handles missing days. With `estimate` (the default), short gaps are filled with an estimate and the days are marked as estimated; with `missing`, they add nothing and are counted as missing."
tz = "The time zone of hourly times. Times are always given in UTC; `local` adds a `local_time` column in the location's own time zone. Daily results follow `day_basis` either way."
day_basis = "Whose clock decides which hours make up a day. With `central`, each day runs from midnight to midnight Central Standard Time all year (06:00 to 06:00 UTC), the same days our maps use. With `local`, each day runs from midnight to midnight on the location's own clock, with daylight saving time. Leaving it out uses `central` inside the area we cover and `local` outside it. `meta.location.days` says which hours each day covers."
units = "The unit system: `us` (°F, inches, mph; the default) or `metric` (°C, millimeters, km/h). To set one variable's unit, add its name as a parameter, as `precipitation=mm`."
format = "The format of the response: `json` (the default) or `csv`. Without it, the `Accept` header is used."
orient = "The layout of JSON data: `columns` (the default), an object with one list per column, or `records`, a list of rows. Spreadsheet and table tools often prefer `records`."
headers = "For CSV: whether to include the description of the request as lines beginning with `#` above the column names (`true`, the default). Use `false` for a plain table."
model_id = "The model's identifier, as listed by `/models` (for example `tar-spot`)."
layer = "The layer's identifier, as listed by `/layers` (for example `air_temperature_max`, `degree_days` or `tar-spot`)."
dd = "The degree-day settings, required unless `base` is given. Each is a method, a base temperature and an optional upper threshold, joined by underscores, in the request's units: `sine_50_86`, `modified_50_86` or `average_43`. The methods are `sine` (single sine), `modified` (daily minimum and maximum limited to the base and upper threshold, then averaged) and `average` (simple average). A decimal threshold is written `39.2` or `39p2`. Several settings may be given, separated by commas."
base = "The base temperature of a single degree-day setting, in the request's units, in place of `dd`."
upper = "The upper threshold of a single degree-day setting given with `base`. Leave it out for no upper threshold."
method = "The method of a single degree-day setting given with `base`: `sine` (the default), `modified` or `average`."
biofix = "The day from which running totals start: a date (YYYY-MM-DD), or a month and day (MM-DD) for the latest one on or before the end date, so `04-15` is this year's April 15 and, in February, `11-01` is last November 1. The default is `start`."
projection = "Continue past the forecast to `end` using the weather of each earlier year in the archive. With `true`, each value is the median across those years, with the 10th and 90th percentiles in columns ending `_p10` and `_p90`. With `years`, each year's path is returned separately, with a `year` column. Off by default."
planting_date = "The crop's planting date, which sets the crop's growth stages and the period when it is susceptible: a date (YYYY-MM-DD), or `early`, `mid` or `late` for the typical planting dates at the location, or `all` for all three. Without it, no susceptible period is applied."
stat = "Combine a range of days into one map: `sum`, `mean`, `min`, `max`, `count` with `count`, or `first`, `last` or `since` with the parameter of that name. Only values that add up over days (precipitation, evapotranspiration, sunlight, hour counts and degree days) can be summed. Without `start`, the range runs from January 1 of the end date's year."
count = "Count the days (or hours) in a range whose value is within bounds, as one map: `days_above_86`, `days_below_32` or `days_between_50_86`, with both bounds included, in the units the layer is shown in (°F with `units=us`). A daily layer counts days and an hourly one hours (`hours_above_86`). A decimal is written `93.2` or `93p2`. Each location's `missing_days` (or `missing_hours`) says how many it had no value for; they are left out of the count, never assumed. Without `start`, the range runs from January 1 of the end date's year."
first = "Map the first day in a range whose value is within bounds: `above_50`, `below_32` or `between_50_86`, with both bounds included, in the units the layer is shown in, or a named temperature for the daily minimum: `frost` (32 °F or colder), `hard_freeze` (28 °F) or `killing_freeze` (24 °F). Only daily layers take it, and only measured days count. The range ends on `end` (the latest day by default). Without `start`, a range looking for values at or below a bound starts on the previous July 1, so in spring `first=frost` gives last fall's first frost; any other starts on January 1. Locations where no day was within the bounds show as None, separate from locations without data; in JSON and CSV the date is given as YYYY-MM-DD with a `found` column (`false` for none), and NetCDF and GeoTIFF give days since January 1, 1970."
last = "Map the last day in a range whose value is within bounds, as for `first`: `last=frost` in May gives this spring's last frost so far, and `last=frost&end=2026-06-30` the whole spring's."
since = "Map the number of days since the last day within bounds, as for `first`, counted to the range's end: `since=hard_freeze` gives the days since the last hard freeze (28 °F or colder)."
output = "For a model layer, which of the model's results to show (`/layers` lists them). The default is the model's risk level, or the growth stage for a crop model."
planting = "For a model layer that depends on a crop: use each location's typical `early`, `mid` (the default) or `late` planting date, or `none` for the model's own default dates without regard to the crop's growth stage."
season = "For a seasonal layer such as potato volunteer survival: the season, as `2025-26`. The default is the current season. The map shows the season through its last day, or through the last observed day if the season isn't over."
region = "Limit the map to a state (by name or postal code, as `wisconsin` or `WI`) or a county (by its name and state, as `Dane, WI`, or its five-digit FIPS code, as `55025`)."
scale = "The range of values the colors span, for a map image, colored tiles, their legend or their description. Leave it out, or give `auto`, to take the range from the map's own values (from its 2nd to its 98th percentile, rounded), so the colors fit each map; give `default` for the layer's usual range where it has one, so that maps of different days use the same colors. Or give two values in the request's units, such as `scale=40,90` for 40 to 90 °F, or three, such as `scale=0,32,100`, to also put the palette's middle color at a value: freezing here, or a total of interest on a degree-day map (`scale=,500,`). Leave an end blank (`scale=40,` or `scale=0,32,`) to take it from the map. If the map's values all lie on one side of the middle, only that half of the palette is used. Wind direction keeps its compass range, and maps of risk levels and other categories have a color for each level and take no scale."
palette = "The colors for a map image, colored tiles, their legend or their description: the name of any palette `GET /api/v2/palettes` lists, such as `viridis`, with `_r` added to reverse it (`BuYlRd_r` runs from red to blue). Leaving `palette` out uses the layer's usual palette. A map of risk levels or other categories takes only a categorical palette with one color for each of its levels."
style = "Leave this out for data tiles, whose colors encode values for map software to read. Use `default` for tiles colored with the layer's palette, ready to display in ArcGIS, QGIS or a web map."
time = "The time to show: `latest` (the default), a day (`2025-07-08`), an hour (`2025-07-08T15` in UTC, or Unix time in seconds), a range of days with `stat` (`2025-07-01..2025-07-07`), or a season (`2025-26`)."
radius = "Average the weather over the area around each location instead of using its one grid cell: the area's radius in miles (in kilometers with `units=metric`), up to 10 miles (16 km). Each grid cell is about 1.5 miles (2.4 km) across, so a 5-mile radius covers about 35 cells. The weather of every cell in the area is averaged hour by hour, and degree days, freezes and models are then worked out from that average, so the results describe the area's weather rather than one spot's. Air temperature and wind include cells over lakes, whose air moves inland; soil and snow are averaged over land only. Use it where a location's own cell is unusual, such as a lakeshore, a city or a valley. Only locations inside the area we cover, from 2016 on, take a radius. `meta.location.area` says how many cells were averaged."
weighting = "How the cells within `radius` count toward the average: `equal` (the default), each the same, or `center`, more for cells near the location, falling off with distance."
land_only = "With `radius`: `true` leaves out the grid cells that are entirely open water (lakes, reservoirs, wide rivers and the Great Lakes, from the National Hydrography Dataset), so the area's weather is the land's. A cell with any land in it stays in. The default is `false`."
roll = "Add a rolling window beside each value: the window's length in days, from 2 to 365, or several separated by commas, as `roll=7,14,28`. Each adds a column named for its length (`air_temperature_max_7d`) holding, on each day, the values of that many days combined by `roll_stat`. A window ends on its day unless `roll_align=centered`. The days a window needs before `start` (or after `end`) are read for it, so the first row has a whole window. `meta.summary.roll` lists each window's statistic, the days whose windows were shortened at the ends of the data, and the first day whose window includes forecast days."
roll_stat = "How a rolling window combines its days: `sum`, `mean`, `min` or `max`. The default is `sum` for values that add up over days (precipitation, evapotranspiration, sunlight, hour counts and degree days), so a 7-day window of precipitation is the week's total, and `mean` for everything else. Only values that add up can be summed. In a sum, a missing day of precipitation counts as no rain, and short gaps in other values are filled with an estimate."
roll_align = "Where a rolling window sits: `trailing` (the default), the day and the days before it, or `centered`, the day in the middle with as many days on each side (for an even length, one more day before it). A centered window near today includes forecast days, so its values change as forecasts and observations come in."
roll_partial = "Whether a rolling window that reaches past the ends of the data (before the first day with data, or after the forecast's last day) still has a value. With `false` (the default) it has none; with `true` it combines the days it has, as R's zoo package does with `partial = TRUE`."
roll_coverage = "The smallest share of a rolling window's days, in percent, that must have data for the window to have a value; days without data are left out of a mean, minimum or maximum. The default is 75, so a 7-day window may miss one day and a 28-day window seven. Use 0 to accept a window with data on any one day."

[weather_daily]
vars = "The variables to return, separated by commas, by their names in `/variables` (daily variables). The default is the minimum and maximum air temperature and precipitation."

[weather_hourly]
start = "The first hour, as an ISO date and time (`2026-06-01T05:00Z`, `2026-06-01T05` or with an offset such as `-05:00`; without one, UTC) or as Unix time in seconds or milliseconds (`1780290000`). Each hour is labeled by its end. The default is seven days before the current hour."
end = "The last hour, as an ISO date and time (`2026-06-01T05:00Z`, `2026-06-01T05` or with an offset such as `-05:00`; without one, UTC) or as Unix time in seconds or milliseconds (`1780290000`), included in the results. The default runs through the forecast, or through the last observed hour with `forecast=false`."
vars = "The variables to return, separated by commas, by their names in `/variables` (hourly variables). The default is air temperature, dew point, relative humidity, precipitation and wind speed."
day_basis = "Not used here: hourly values aren't grouped into days. Use `tz=local` to see each hour on the location's own clock."

[weather_totals]
start = "The first day of the period, as YYYY-MM-DD. The default is January 1 of the year of `end`."
end = "The last day of the period, as YYYY-MM-DD. The default runs through the forecast, or through today with `forecast=false`."
forecast = "Whether to include forecast days in the totals (`true`, the default) or only observed days (`false`). The `forecast_days` column says how many forecast days each total includes."
vars = "The variables to total, separated by commas: precipitation, evapotranspiration, water balance, sunlight and counts of hours (such as hours with relative humidity of 90% or more). The default is precipitation, reference evapotranspiration (ET0) and sunlight, or none when `count` is given."
count = "Count the days or hours in the period whose value is within bounds: a variable's name from `/variables`, a colon, and what to count, as `air_temperature_max:days_above_86`, `air_temperature_min:days_below_32` or `precipitation_sum:days_between_0p01_0p25`. Daily variables count days and hourly ones hours (`air_temperature:hours_above_86`). Bounds are included and are in the units the variable is shown in (°F and inches with `units=us`); a decimal is written `0.5` or `0p5`. Repeat `count`, or separate several with commas. Each count has a column named after it, and a column ending `_missing_days` (or `_missing_hours`) for the days it had no value for, which are left out of the count, never assumed."
first = "Find the first day in the period whose daily value is within bounds: a daily variable's name from `/variables`, a colon, and the bounds, as `soil_temperature_10cm_mean:above_50`, or a named temperature for the daily minimum: `air_temperature_min:frost` (32 °F or colder), `hard_freeze` (28 °F) or `killing_freeze` (24 °F). Bounds are included and are in the units the variable is shown in. Only measured days count. Without `start`, one looking for values at or below a bound starts on the previous July 1 (so in spring `first=air_temperature_min:frost` gives last fall's first frost), and any other on January 1. Repeat it, or separate several with commas. Each has a column named after it (`air_temperature_min_first_frost`), empty where no day was within the bounds, and a column ending `_missing_days` for the days without a value."
last = "Find the last day in the period whose daily value is within bounds, as for `first`: `last=air_temperature_min:frost` in May gives this spring's last frost so far."
since = "The number of days since the last day within bounds, as for `first`, counted to `end`, or to today when `end` is left out: `since=air_temperature_min:hard_freeze` gives the days since the last hard freeze."
interval = "With `month`, one row for each location and calendar month in the period, with a `month` column (as `2026-07`), in place of one row for the whole period."

[degree_days_daily]
targets = "Running totals to watch for, in degree days in the request's units, separated by commas (as `1400,2000`). For each setting, `meta.summary.targets` gives the day each total is reached, or is expected to be reached when the forecast or a projection is included."
end = "The last day, as YYYY-MM-DD. The default runs through the forecast; with `projection`, it is December 31."

[degree_days_table]
end = "The last day of the period, as YYYY-MM-DD. The default runs through the forecast, or through today with `forecast=false`."
forecast = "Whether to include forecast days in the totals (`true`, the default) or only observed days (`false`). The `forecast_days` column says how many forecast days each total includes."

[degree_days_freeze]
thresholds = "The temperatures to count as a freeze, in the request's units, separated by commas. The default is 32, 28 and 24 °F."

[degree_days_chill_at_points]
method = "How chill is counted: `dynamic` (the default) for chill portions from the Dynamic model, `utah` for Utah chill units, or `hours` for chill hours."
bounds = "With `method=hours`: the temperatures chill hours count between, both included, in the request's units, lower first and separated by a comma. The default is 32,45 °F (0,7.2 °C)."
start = "The first day, as YYYY-MM-DD. The default is the October 1 before the end date, the usual start of a chill season."
end = "The last day, as YYYY-MM-DD. The default runs through the forecast, or through today with `forecast=false`."
date = "A single day, as YYYY-MM-DD, in place of `start` and `end`."

[models_run]
points = "Several locations in one request, in place of `lat` and `lng`: latitude and longitude pairs separated by semicolons, as `43.07,-89.40;44.52,-89.57`. Up to 50 locations, or 10 with `projection`. Each row of the response has a `point` column giving its location's position in `meta.locations`, and `meta.summary.points` gives what was worked out at each location, such as its biofix or typical planting dates."
start = "The first day. The default is the model's start for the season: the biofix or planting date where the model has one, otherwise January 1."
end = "The last day. The default runs through the forecast; with `projection`, it is the end of the model's season."
biofix = "The day the model starts counting, where the model uses one (`/models/{model_id}` says whether it does and what its default is): a date (YYYY-MM-DD), or a month and day (MM-DD) for the latest one on or before the end date."
season = "For a seasonal model such as potato volunteer survival: the season, as `2025-26`, in place of `start` and `end`. The default is the current season."

[models_run_several]
points = "Not used: the models run at one location, given by `lat` and `lng`."
models = "The models to run, separated by commas (as `tar-spot,white-mold`), or `all` (the default)."
start = "The first day. The default is January 1."
end = "The last day. The default runs through the forecast; with `projection`, it is December 31."
format = "The format of the response: only `json` is available, because the result holds a table for each model."

[models_risk]
points = "Not used: risk is reported for one location, given by `lat` and `lng`."
date = "The day to report, as YYYY-MM-DD. The default is today. A day past the forecast needs `projection=true`."
models = "The models to report, separated by commas, or `all`. The default is every model that is in season and covers the location's region."
projection = "With `true`, a `date` past the forecast reports each model's median risk across the earlier years in the archive."

[models_evaluate]
units = "The unit system of the input values you send and of the results: `us` (the default) or `metric`."

[grids_grid]
roll = "Show a rolling window of days ending on `date` (or the latest day) instead of one day: its length in days, from 2 to 365. The days are combined by `stat`; without one, they are added up for values that add up over days (precipitation, evapotranspiration, sunlight, hour counts and degree days) and averaged for everything else. `count` counts days within the window. Only daily layers take a window, and not running totals, which already add up the days. `roll_align=centered` puts the date in the middle of the window."
day_basis = "Maps and grids use the same days everywhere: midnight to midnight Central Standard Time all year (06:00 to 06:00 UTC), so neighboring cells cover the same hours. `central` is accepted; `local` is refused. For a location's own days, ask for its weather or model at the point."
biofix = "For degree days: the first day of the total, as a date (YYYY-MM-DD) or a month and day (MM-DD, the latest on or before the end date). The days are added up unless you choose another `stat`. Other layers take `start` instead."
date = "A single day for a daily layer, as YYYY-MM-DD. The default is the last day observed across the whole map."
time = "A single hour for an hourly layer, as an ISO date and time (`2026-06-01T05:00Z`, `2026-06-01T05` or with an offset such as `-05:00`; without one, UTC) or as Unix time in seconds or milliseconds (`1780290000`). The default is the last observed hour."
start = "The first day (or hour) of a range. Each step of the range is returned, unless `stat` combines them into one map. With `stat` and no `start`, a daily range runs from January 1; an hourly one needs a start. A range can cover up to 366 days or 31 days of hours."
end = "The last day (or hour) of a range, included in the results. The default is the last observed day."
gaps = "With `stat=sum` and degree days: `estimate` (the default) fills gaps of up to seven days with an estimate and counts them in `estimated_days`; `missing` leaves them out and counts them in `missing_days`. Precipitation is never estimated."
bbox = "Limit the map to a box: its south, west, north and east edges in decimal degrees, separated by commas. The default is the whole area the service covers."
clip = "With `bbox` or `region`: `true` returns only the cells inside the box or region. The default, `false`, returns every cell of the smallest rectangle on the grid that holds them, so the results form a complete grid."
land_only = "`true` leaves out the grid cells that are entirely open water (lakes, reservoirs, wide rivers and the Great Lakes, from the National Hydrography Dataset). A cell with any land in it stays in. The default is `false`."
stride = "Return every nth cell in each direction, for a quick overview of a large area. The default is 1, every cell."
grid = "The grid of the results: `native` (the default), the National Weather Service's 2.5 km grid on its Lambert conformal projection, or `latlon`, a regular latitude and longitude grid with a spacing of `res` degrees."
res = "For `grid=latlon`: the spacing in degrees, at least 0.025 (for example `0.1`)."
method = "For `grid=latlon`: how each point gets its value, from the cell it falls in (`nearest`) or the mean of the cells within half a spacing of it (`mean`). The default is `mean` for spacings of 0.05° or more and `nearest` below that."
cells = "For JSON and CSV: add each cell's row and column on the native grid (`j` and `i`)."
format = "The format of the response: `json` (the default), `csv`, `netcdf` or `geotiff`. JSON and CSV hold up to 2 million values; larger maps are available as NetCDF or GeoTIFF files. Without it, the `Accept` header is used."

[tiles_tile]
roll = "Show a rolling window of days ending on the tile's day (or the latest day) instead of one day: its length in days, from 2 to 365. The tile's time must be one day, not a range. The days are combined by `stat`; without one, they are added up for values that add up over days (precipitation, evapotranspiration, sunlight, hour counts and degree days) and averaged for everything else. Only daily layers take a window, and not running totals. `roll_align=centered` puts the day in the middle of the window."
day_basis = "Maps and grids use the same days everywhere: midnight to midnight Central Standard Time all year (06:00 to 06:00 UTC), so neighboring cells cover the same hours. `central` is accepted; `local` is refused. For a location's own days, ask for its weather or model at the point."
when = "The time to show: `latest`, a day (`2025-07-08`), an hour (`2025-07-08T15` in UTC, or Unix time in seconds), a range of days with `stat` (`2025-07-01..2025-07-07`), or a season (`2025-26`)."
z = "The zoom level, from 0 to 8."
x = "The tile's column at this zoom level."
y = "The tile's row at this zoom level."
units = "Tiles look the same in either unit system, and data tiles always hold values in the layer's stored unit, given by the TileJSON. The parameter is accepted so that a tile, its TileJSON and its legend can share the same settings."

[tiles_legend]
roll = "Show a rolling window of days ending on `date` (or the latest day) instead of one day: its length in days, from 2 to 365. The days are combined by `stat`; without one, they are added up for values that add up over days (precipitation, evapotranspiration, sunlight, hour counts and degree days) and averaged for everything else. `count` counts days within the window. Only daily layers take a window, and not running totals, which already add up the days. `roll_align=centered` puts the date in the middle of the window."
day_basis = "Maps and grids use the same days everywhere: midnight to midnight Central Standard Time all year (06:00 to 06:00 UTC), so neighboring cells cover the same hours. `central` is accepted; `local` is refused. For a location's own days, ask for its weather or model at the point."
units = "The unit system of the legend's labels: `us` (the default) or `metric`."

[maps_static_map]
roll = "Show a rolling window of days ending on `date` (or the latest day) instead of one day: its length in days, from 2 to 365. The days are combined by `stat`; without one, they are added up for values that add up over days (precipitation, evapotranspiration, sunlight, hour counts and degree days) and averaged for everything else. `count` counts days within the window. Only daily layers take a window, and not running totals, which already add up the days. `roll_align=centered` puts the date in the middle of the window."
day_basis = "Maps and grids use the same days everywhere: midnight to midnight Central Standard Time all year (06:00 to 06:00 UTC), so neighboring cells cover the same hours. `central` is accepted; `local` is refused. For a location's own days, ask for its weather or model at the point."
biofix = "For degree days: the first day of the total, as a date (YYYY-MM-DD) or a month and day (MM-DD, the latest on or before the end date). The days are added up unless you choose another `stat`. Other layers take `start` instead."
date = "A single day for a daily layer, as YYYY-MM-DD. The default is the latest day, so a link to the map always shows the current one."
time = "A single hour for an hourly layer, as an ISO date and time (`2026-06-01T05:00Z`, `2026-06-01T05` or with an offset such as `-05:00`; without one, UTC) or as Unix time in seconds or milliseconds (`1780290000`)."
start = "The first day of a range, which `stat` combines into one map. With `stat` and no `start`, the range runs from January 1."
end = "The last day of a range. The default is the latest day."
days = "A shortcut for a range: the number of days ending on `end` or the latest day. For example, `days=7&stat=sum` shows the past week's total."
region = "Frame the map on a state (by name or postal code, as `wisconsin` or `WI`) or a county (by its name and state, as `Dane, WI`, or its five-digit FIPS code, as `55025`)."
clip = "With `region`, `true` shows only the region's own locations and leaves the rest of the frame blank. The default, `false`, shows every location in the frame."
width = "The image's width in pixels, from 400 to 2000. The default is 800."
gaps = "With `stat=sum`: `estimate` (the default) fills gaps of up to seven days with an estimate; `missing` leaves them out."
isolines = "Draw lines of equal value on the map, labelled with their values: `auto` for a line at each value marked on the legend, or a number for a line every so many units in the request's units, such as `isolines=5` for every 5 °F (days on a map of dates); the legend is then marked at the same values. The lines follow the map's values lightly smoothed, so that small hollows don't each draw a ring. With a middle value in `scale`, its line is drawn heavier. The default is `off`. Maps of risk levels and other categories take no isolines."

[tiles_tilejson]
roll = "Show a rolling window of days ending on `date` (or the latest day) instead of one day: its length in days, from 2 to 365. The days are combined by `stat`; without one, they are added up for values that add up over days (precipitation, evapotranspiration, sunlight, hour counts and degree days) and averaged for everything else. `count` counts days within the window. Only daily layers take a window, and not running totals, which already add up the days. `roll_align=centered` puts the date in the middle of the window."
day_basis = "Maps and grids use the same days everywhere: midnight to midnight Central Standard Time all year (06:00 to 06:00 UTC), so neighboring cells cover the same hours. `central` is accepted; `local` is refused. For a location's own days, ask for its weather or model at the point."

[summaries_summary]
roll = "Show a rolling window of days ending on `date` (or the latest day) instead of one day: its length in days, from 2 to 365. The days are combined by `stat`; without one, they are added up for values that add up over days (precipitation, evapotranspiration, sunlight, hour counts and degree days) and averaged for everything else. `count` counts days within the window. Only daily layers take a window, and not running totals, which already add up the days. `roll_align=centered` puts the date in the middle of the window."
by = "Summarize by `county` (the default) or `state`."
region = "Limit the rows to a state (by name or postal code, as `wisconsin` or `WI`) or a county (by its name and state, as `Dane, WI`, or its five-digit FIPS code, as `55025`). With `by=county`, a state gives a row for each of its counties. The default is every county or state that is at least partly in the area we cover."
min_coverage = "The smallest share of a county's or state's grid cells, in percent, that must have data for its statistics to be given. Below it, the row's statistics are empty (`null`). The default is 50; use 100 for whole counties only, or 0 for any data at all."
interval = "With `month`, one row for each county or state and calendar month of the range, with a `month` column (as `2026-07`). It needs a range and a statistic (`stat`, `count`, `first` or `last`), on a daily layer."
day_basis = "Summaries use the same days everywhere: midnight to midnight Central Standard Time all year (06:00 to 06:00 UTC), so neighboring cells cover the same hours. `central` is accepted; `local` is refused."
biofix = "For degree days: the first day of the total, as a date (YYYY-MM-DD) or a month and day (MM-DD, the latest on or before the end date). The days are added up unless you choose another `stat`. Other layers take `start` instead."
date = "A single day for a daily layer, as YYYY-MM-DD. The default is the last day observed across the whole map."
time = "A single hour for an hourly layer, as an ISO date and time (`2026-06-01T05:00Z`, `2026-06-01T05` or with an offset such as `-05:00`; without one, UTC). The default is the last observed hour."
start = "The first day (or hour) of a range. Each step of the range gets its own rows, unless `stat` combines them. With `stat` and no `start`, a daily range runs from January 1; an hourly one needs a start."
end = "The last day (or hour) of a range, included in the results. The default is the last observed day."
gaps = "With `stat=sum` and degree days: `estimate` (the default) fills gaps of up to seven days with an estimate; `missing` leaves them out. Precipitation is never estimated."
format = "The format of the response: `json` (the default) or `csv`. Without it, the `Accept` header is used."
