# Workspace root: not a package itself. Members are the two libraries and the Django app.
[project]
name = "agweather2"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
license = "AGPL-3.0-or-later"
dependencies = [
    "agmodels",
    "agdata[ifs]",  # the IFS ingest (D52); optional in the package itself (D53)
    "agweather-app",
]

[dependency-groups]
dev = [
    "django-types>=0.24.0",
    "honcho>=2.0.0",
    "pytest",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "pytest-socket",
    "pytest-xdist>=3.8.0",
    "ruff",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "app"]

[tool.uv.sources]
agmodels = { workspace = true }
agdata = { workspace = true }
agweather-app = { workspace = true }

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["tmp", "data", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "DTZ", "RUF"]
# The formatter keeps code to line-length; a string or comment stays on one line, wrapped by the editor (Ben,
# 2026-11-17), so prose is edited without reflowing
ignore = ["E501"]
# Scientific notation in docstrings and comments (FAO-56's symbols, ranges, minus signs)
allowed-confusables = ["–", "−", "×", "γ", "σ", "α"]

[tool.ruff.lint.per-file-ignores]
# Django's declarative class attributes (Meta, ModelAdmin, migrations) are lists by convention
"app/**/{models,admin}.py" = ["RUF012"]
"app/**/migrations/*.py" = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["agmodels", "agdata", "config", "web", "ops", "api", "updates", "pilot_encoding"]

[tool.pytest.ini_options]
# Tests never use the network (CLAUDE.md); fixtures are recorded. Postgres on localhost is the exception.
addopts = "--import-mode=importlib --disable-socket --allow-unix-socket --allow-hosts=127.0.0.1,::1,localhost"
testpaths = ["packages/agmodels/tests", "packages/agdata/tests", "app"]
# Keep only the last run's temp folders, and of those only failed tests' (a run writes ~2 GB, in memory: conftest.py)
tmp_path_retention_count = 1
tmp_path_retention_policy = "failed"
pythonpath = ["app"]
DJANGO_SETTINGS_MODULE = "config.settings"

[tool.pyright]
include = ["packages", "app"]
# The fixture makers are one-off scripts that read the network
exclude = ["**/node_modules", "**/__pycache__", "tmp", "data", "**/tests/fixtures/make_*.py"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
extraPaths = ["app"]
typeCheckingMode = "basic"
