name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-26.04

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:password@localhost:5432/agweather2_test
      E2E_DATABASE_URL: postgres://postgres:password@localhost:5432/agweather2_e2e

    steps:
      - uses: actions/checkout@v7

      # GRIB decoding uses the system ecCodes (CLAUDE.md)
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libeccodes-dev

      - uses: astral-sh/setup-uv@v10.3.2  # setup-uv publishes no floating major tag
        with:
          enable-cache: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - run: bin/ci

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
